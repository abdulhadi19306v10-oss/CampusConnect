<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facility Booking - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-sm btn-outline-secondary me-3"><i class="fa-solid fa-house"></i> Home</a>
        <span class="me-3 fw-medium text-secondary user-name">Student</span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 d-none d-md-block sidebar px-0">
        <div class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
          <a class="nav-link" href="courses.html"><i class="fa-solid fa-book"></i> Courses</a>
          <a class="nav-link" href="timetable.html"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
          <a class="nav-link active" href="bookings.html"><i class="fa-solid fa-building"></i> Facilities</a>
          <a class="nav-link" href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
          <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        </div>
      </div>

      <div class="col-md-10 dashboard-content bg-light">
        <div id="alertContainer"></div>

        <div class="row g-4">
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-header bg-white pt-4 pb-0 border-bottom-0">
                <h5 class="fw-bold">New Booking</h5>
              </div>
              <div class="card-body">
                <form id="bookingForm">
                  <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">Facility</label>
                    <select class="form-select bg-light" id="facilityId" required></select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">Date</label>
                    <input type="date" class="form-control bg-light" id="date" required>
                  </div>
                  <div class="row">
                    <div class="col-6 mb-3">
                      <label class="form-label text-muted fw-semibold">Start Time</label>
                      <input type="time" class="form-control bg-light" id="startTime" required>
                    </div>
                    <div class="col-6 mb-3">
                      <label class="form-label text-muted fw-semibold">End Time</label>
                      <input type="time" class="form-control bg-light" id="endTime" required>
                    </div>
                  </div>
                  <div class="mb-4">
                    <label class="form-label text-muted fw-semibold">Purpose</label>
                    <textarea class="form-control bg-light" id="purpose" rows="2" required></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 fw-bold">Submit Request</button>
                </form>
              </div>
            </div>
          </div>
          
          <div class="col-md-8">
            <div class="card h-100">
              <div class="card-header bg-white pt-4 pb-0 border-bottom-0">
                <h5 class="fw-bold">My Bookings</h5>
              </div>
              <div class="card-body">
                
            <div class="mb-3 d-flex justify-content-end table-search-container">
              <div class="input-group" style="width: 250px;">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0 bg-light page-search" placeholder="Search...">
              </div>
            </div>
            <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Facility</th>
                        <th>Date & Time</th>
                        <th>Status</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody id="myBookingsTable">
                      <tr><td colspan="4" class="text-center">Loading...</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    $(document).ready(function() {
      // Set min date to today
      const today = new Date().toISOString().split('T')[0];
      $('#date').attr('min', today);

      loadFacilities();
      loadBookings();

      function loadFacilities() {
        API.getFacilities().done(res => {
          let html = '<option value="">Select a facility</option>';
          res.data.forEach(f => {
            if(f.isActive) html += `<option value="${f._id}">${f.name} (Cap: ${f.capacity})</option>`;
          });
          $('#facilityId').html(html);
        });
      }

      function loadBookings() {
        API.getMyBookings().done(res => {
          let html = '';
          if(res.data.length === 0) html = '<tr><td colspan="4" class="text-center">No bookings found.</td></tr>';
          res.data.forEach(b => {
            let badge = 'secondary';
            if(b.status === 'APPROVED') badge = 'success';
            if(b.status === 'REJECTED' || b.status === 'CANCELLED') badge = 'danger';
            if(b.status === 'PENDING') badge = 'warning';

            html += `<tr>
              <td class="fw-bold">${b.facilityId?.name || 'Unknown'}</td>
              <td>${b.date}<br><small class="text-muted">${b.startTime} - ${b.endTime}</small></td>
              <td><span class="badge bg-${badge}">${b.status}</span></td>
              <td>
                ${(b.status === 'PENDING' || b.status === 'APPROVED') ? 
                  `<button class="btn btn-sm btn-outline-danger cancel-btn" data-id="${b._id}">Cancel</button>` : 
                  '-'}
              </td>
            </tr>`;
          });
          $('#myBookingsTable').html(html);
        });
      }

      $('#bookingForm').submit(function(e) {
        e.preventDefault();
        const data = {
          facilityId: $('#facilityId').val(),
          date: $('#date').val(),
          startTime: $('#startTime').val(),
          endTime: $('#endTime').val(),
          purpose: $('#purpose').val()
        };
        
        API.createBooking(data).done(res => {
          showAlert(res.message, 'success');
          $('#bookingForm')[0].reset();
          loadBookings();
        }).fail(err => {
          showAlert(err.responseJSON?.message || 'Error booking', 'danger');
        });
      });

      $(document).on('click', '.cancel-btn', function() {
        if(!confirm('Cancel this booking?')) return;
        API.cancelBooking($(this).data('id')).done(res => {
          showAlert(res.message, 'success');
          loadBookings();
        }).fail(err => {
          showAlert('Failed to cancel', 'danger');
        });
      });
    });
  </script>

  <script>
    $(document).ready(function() {
      // Global Table Live Search
      $('.page-search').on('keyup', function() {
        const value = $(this).val().toLowerCase();
        // find the closest table-responsive container which is a sibling of the search container
        $(this).closest('.table-search-container').next('.table-responsive').find('tbody tr').filter(function() {
          $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
      });
    });
  </script>
</body>
</html>

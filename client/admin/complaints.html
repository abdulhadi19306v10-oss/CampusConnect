<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Complaints - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect Admin</a>
      <div class="d-flex align-items-center">
        <a href="../index.html" class="btn btn-sm btn-outline-secondary me-3"><i class="fa-solid fa-house"></i> Home</a>
        <span class="me-3 fw-medium text-secondary user-name">Admin</span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 d-none d-md-block sidebar px-0">
        <div class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
          <a class="nav-link" href="students.html"><i class="fa-solid fa-users"></i> Students</a>
          <a class="nav-link" href="faculty.html"><i class="fa-solid fa-chalkboard-user"></i> Faculty</a>
          <a class="nav-link" href="courses.html"><i class="fa-solid fa-book"></i> Courses</a>
          <a class="nav-link" href="bookings.html"><i class="fa-solid fa-building"></i> Bookings</a>
          <a class="nav-link active" href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
          <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        </div>
      </div>

      <div class="col-md-10 dashboard-content bg-light">
        <div id="alertContainer"></div>
        <div class="card">
          <div class="card-header bg-white pt-4 pb-0 border-bottom-0">
            <h5 class="fw-bold">Manage Complaints</h5>
          </div>
          <div class="card-body">
            
            <div class="mb-3 d-flex justify-content-end table-search-container">
              <div class="input-group" style="width: 250px;">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0 bg-light page-search" placeholder="Search...">
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Student</th>
                    <th>Issue</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="complaintsTable">
                  <tr><td colspan="4" class="text-center">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Resolve Modal -->
  <div class="modal fade" id="resolveModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header border-bottom-0">
          <h5 class="modal-title fw-bold">Resolve Complaint</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="complaintId">
          <div class="mb-3">
            <label class="form-label text-muted fw-semibold">Status</label>
            <select class="form-select" id="newStatus">
              <option value="IN_PROGRESS">In Progress</option>
              <option value="RESOLVED">Resolved</option>
              <option value="CLOSED">Closed</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted fw-semibold">Admin Response</label>
            <textarea class="form-control" id="adminResponse" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer border-top-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveComplaintBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    $(document).ready(function() {
      loadComplaints();
      const resolveModal = new bootstrap.Modal(document.getElementById('resolveModal'));

      function loadComplaints() {
        API.getAllComplaints().done(res => {
          let html = '';
          res.data.forEach(c => {
            let badge = 'secondary';
            if(c.status === 'OPEN') badge = 'danger';
            if(c.status === 'IN_PROGRESS') badge = 'warning';
            if(c.status === 'RESOLVED' || c.status === 'CLOSED') badge = 'success';

            html += `<tr>
              <td>${c.studentId?.name || 'Unknown'}</td>
              <td><strong>${c.subject}</strong><br><small class="text-muted">${c.category}</small></td>
              <td><span class="badge bg-${badge}">${c.status}</span></td>
              <td>
                <button class="btn btn-sm btn-primary edit-btn" data-id="${c._id}" data-status="${c.status}" data-resp="${c.adminResponse || ''}">Respond</button>
              </td>
            </tr>`;
          });
          $('#complaintsTable').html(html);
        });
      }

      $(document).on('click', '.edit-btn', function() {
        $('#complaintId').val($(this).data('id'));
        $('#newStatus').val($(this).data('status') === 'OPEN' ? 'IN_PROGRESS' : $(this).data('status'));
        $('#adminResponse').val($(this).data('resp'));
        resolveModal.show();
      });

      $('#saveComplaintBtn').click(function() {
        const id = $('#complaintId').val();
        const data = {
          status: $('#newStatus').val(),
          adminResponse: $('#adminResponse').val()
        };
        
        API.updateComplaintStatus(id, data).done(res => {
          showAlert(res.message, 'success');
          resolveModal.hide();
          loadComplaints();
        }).fail(err => {
          showAlert('Error updating', 'danger');
        });
      });
    });
  </script>

  <script>
    $(document).ready(function() {
      // Global Table Live Search
      $('.page-search').on('keyup', function() {
        const value = $(this).val().toLowerCase();
        // find the closest table-responsive container which is a sibling of the search container
        $(this).closest('.table-search-container').next('.table-responsive').find('tbody tr').filter(function() {
          $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
      });
    });
  </script>
</body>
</html>

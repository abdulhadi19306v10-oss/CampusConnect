<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Announcements - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-sm btn-outline-secondary me-3"><i class="fa-solid fa-house"></i> Home</a>
        <span class="me-3 fw-medium text-secondary user-name">Student</span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 d-none d-md-block sidebar px-0">
        <div class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
          <a class="nav-link" href="courses.html"><i class="fa-solid fa-book"></i> Courses</a>
          <a class="nav-link" href="timetable.html"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
          <a class="nav-link" href="bookings.html"><i class="fa-solid fa-building"></i> Facilities</a>
          <a class="nav-link" href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
          <a class="nav-link active" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        </div>
      </div>

      <div class="col-md-10 dashboard-content bg-light">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="fw-bold">Campus Announcements</h2>
        </div>

        <div class="row" id="announcementsContainer">
          <div class="col-12 text-center text-muted">Loading...</div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    $(document).ready(function() {
      API.getAnnouncements().done(res => {
        let html = '';
        if(res.data.length === 0) html = '<div class="col-12 text-muted">No announcements found.</div>';
        res.data.forEach(a => {
          const date = new Date(a.date).toLocaleDateString();
          let bgClass = 'bg-primary';
          if (a.category === 'Facility') bgClass = 'bg-success';
          if (a.category === 'Technical') bgClass = 'bg-warning text-dark';
          
          html += `
            <div class="col-md-6 mb-4">
              <div class="card h-100 border-0 shadow-sm">
                <div class="card-header ${bgClass} text-white fw-bold">
                  ${a.category}
                </div>
                <div class="card-body">
                  <h5 class="card-title fw-bold">${a.title}</h5>
                  <p class="card-text text-muted">${a.description}</p>
                </div>
                <div class="card-footer bg-white text-muted small border-top-0">
                  Posted by ${a.author?.name || 'Admin'} on ${date}
                </div>
              </div>
            </div>
          `;
        });
        $('#announcementsContainer').html(html);
      });
    });
  </script>
</body>
</html>

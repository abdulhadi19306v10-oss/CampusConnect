<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticeboard — CampusConnect</title>
  
  <!-- Bootstrap 5 & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Editorial Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html">
        <div class="brand-icon-editorial">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        CampusConnect
      </a>
      
      <div class="d-flex align-items-center gap-3">
        <span class="mono-tag bg-white text-muted border d-none d-sm-inline-block">Official Broadcasts</span>
        <span class="fw-semibold text-dark user-name small d-none d-md-inline">Student</span>
        <button id="logoutBtn" class="btn-editorial-outline btn-sm py-1 px-3" style="font-size: 0.82rem;">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-2 d-none d-md-block sidebar-editorial">
        <div class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Overview</a>
          <a class="nav-link" href="courses.html"><i class="fa-solid fa-book-bookmark"></i> Courses</a>
          <a class="nav-link" href="timetable.html"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
          <a class="nav-link" href="bookings.html"><i class="fa-solid fa-building-columns"></i> Facilities</a>
          <a class="nav-link" href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Support Desk</a>
          <a class="nav-link active" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Noticeboard</a>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-md-10 p-4 p-md-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom border-light-subtle gap-3">
          <div>
            <span class="mono-tag" style="background: var(--brand-terracotta-light); color: var(--brand-terracotta);">Campus Broadcasts</span>
            <h1 class="font-serif display-6 mb-1 fw-bold mt-1">Official Announcements & Noticeboard</h1>
            <p class="text-muted small mb-0">Verified university bulletins regarding classes, schedules, and operations.</p>
          </div>
        </div>

        <div class="row g-4" id="announcementsContainer">
          <div class="col-12 text-center text-muted py-5">
            <div class="editorial-spinner mx-auto mb-2"></div>
            Loading announcements...
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/anime.min.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    $(document).ready(function() {
      API.getAnnouncements().done(res => {
        let html = '';
        if (!res.data || res.data.length === 0) {
          html = '<div class="col-12 text-center text-muted py-5">No official announcements posted at this time.</div>';
        } else {
          res.data.forEach(a => {
            const date = new Date(a.date).toLocaleDateString(undefined, {
              year: 'numeric', month: 'short', day: 'numeric'
            });

            let accentClass = 'accent-navy';
            let catColor = 'var(--brand-navy)';
            if (a.category === 'Academic') { accentClass = 'accent-terracotta'; catColor = 'var(--brand-terracotta)'; }
            if (a.category === 'Facility') { accentClass = 'accent-sage'; catColor = 'var(--brand-sage)'; }
            if (a.category === 'Technical') { accentClass = 'accent-terracotta'; catColor = 'var(--brand-amber)'; }

            html += `
              <div class="col-md-6 announcement-item">
                <div class="editorial-card h-100 p-4 ${accentClass} anime-card">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="mono-tag" style="background: var(--canvas-subtle); color: ${catColor}; font-weight: 600;">
                      ${a.category || 'General'}
                    </span>
                    <span class="mono-tag bg-white border text-muted">${date}</span>
                  </div>

                  <h4 class="font-serif fw-bold text-dark mt-2 mb-2">${a.title}</h4>
                  <p class="text-muted small mb-4" style="line-height: 1.6;">${a.description}</p>

                  <div class="pt-3 border-top border-light-subtle d-flex align-items-center text-muted small" style="font-size: 0.78rem;">
                    <i class="fa-solid fa-user-pen me-2 text-secondary"></i>
                    <span>Published by <strong>${a.author?.name || 'Academic Administration'}</strong></span>
                  </div>
                </div>
              </div>
            `;
          });
        }
        $('#announcementsContainer').html(html);

        // Animate cards
        anime({
          targets: '.announcement-item',
          translateY: [30, 0],
          opacity: [0, 1],
          delay: anime.stagger(100),
          duration: 650,
          easing: 'easeOutCubic'
        });
      });
    });
  </script>
</body>
</html>

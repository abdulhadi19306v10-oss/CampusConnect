<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complaints - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-sm btn-outline-secondary me-3"><i class="fa-solid fa-house"></i> Home</a>
        <span class="me-3 fw-medium text-secondary user-name">Student</span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 d-none d-md-block sidebar px-0">
        <div class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
          <a class="nav-link" href="courses.html"><i class="fa-solid fa-book"></i> Courses</a>
          <a class="nav-link" href="timetable.html"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
          <a class="nav-link" href="bookings.html"><i class="fa-solid fa-building"></i> Facilities</a>
          <a class="nav-link active" href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
          <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        </div>
      </div>

      <div class="col-md-10 dashboard-content bg-light">
        <div id="alertContainer"></div>

        <div class="row g-4">
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-header bg-white pt-4 pb-0 border-bottom-0">
                <h5 class="fw-bold">Submit a Complaint</h5>
              </div>
              <div class="card-body">
                <form id="complaintForm">
                  <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">Category</label>
                    <select class="form-select bg-light" id="category" required>
                      <option value="">Select Category</option>
                      <option value="Academic">Academic</option>
                      <option value="Facility">Facility</option>
                      <option value="Technical">Technical</option>
                      <option value="Administration">Administration</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">Subject</label>
                    <input type="text" class="form-control bg-light" id="subject" required>
                  </div>
                  <div class="mb-4">
                    <label class="form-label text-muted fw-semibold">Description</label>
                    <textarea class="form-control bg-light" id="description" rows="4" required></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 fw-bold">Submit</button>
                </form>
              </div>
            </div>
          </div>
          
          <div class="col-md-8">
            <div class="card h-100">
              <div class="card-header bg-white pt-4 pb-0 border-bottom-0">
                <h5 class="fw-bold">My Complaints</h5>
              </div>
              <div class="card-body">
                
            <div class="mb-3 d-flex justify-content-end table-search-container">
              <div class="input-group" style="width: 250px;">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0 bg-light page-search" placeholder="Search...">
              </div>
            </div>
            <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Subject</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Admin Response</th>
                      </tr>
                    </thead>
                    <tbody id="myComplaintsTable">
                      <tr><td colspan="4" class="text-center">Loading...</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    $(document).ready(function() {
      loadComplaints();

      function loadComplaints() {
        API.getMyComplaints().done(res => {
          let html = '';
          if(res.data.length === 0) html = '<tr><td colspan="4" class="text-center">No complaints submitted.</td></tr>';
          res.data.forEach(c => {
            let badge = 'secondary';
            if(c.status === 'OPEN') badge = 'danger';
            if(c.status === 'IN_PROGRESS') badge = 'warning';
            if(c.status === 'RESOLVED' || c.status === 'CLOSED') badge = 'success';

            html += `<tr>
              <td class="fw-bold">${c.subject}<br><small class="text-muted text-truncate d-inline-block" style="max-width:200px;">${c.description}</small></td>
              <td>${c.category}</td>
              <td><span class="badge bg-${badge}">${c.status}</span></td>
              <td>${c.adminResponse || '<i class="text-muted">No response yet</i>'}</td>
            </tr>`;
          });
          $('#myComplaintsTable').html(html);
        });
      }

      $('#complaintForm').submit(function(e) {
        e.preventDefault();
        const data = {
          category: $('#category').val(),
          subject: $('#subject').val(),
          description: $('#description').val()
        };
        
        API.submitComplaint(data).done(res => {
          showAlert(res.message, 'success');
          $('#complaintForm')[0].reset();
          loadComplaints();
        }).fail(err => {
          showAlert(err.responseJSON?.message || 'Error submitting', 'danger');
        });
      });
    });
  </script>

  <script>
    $(document).ready(function() {
      // Global Table Live Search
      $('.page-search').on('keyup', function() {
        const value = $(this).val().toLowerCase();
        // find the closest table-responsive container which is a sibling of the search container
        $(this).closest('.table-search-container').next('.table-responsive').find('tbody tr').filter(function() {
          $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
      });
    });
  </script>
</body>
</html>

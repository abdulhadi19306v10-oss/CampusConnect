<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background-color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { max-width: 400px; width: 100%; padding: 40px; border-radius: 16px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .brand-logo { color: #2563eb; font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 2rem; display: block; text-decoration: none;}
  </style>
</head>
<body>

  <div id="loader" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.8);display:none;justify-content:center;align-items:center;z-index:9999;">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div class="login-card">
    <a href="index.html" class="brand-logo"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
    <div class="text-center mb-3"><a href="index.html" class="text-decoration-none text-secondary small"><i class="fa-solid fa-arrow-left me-1"></i>Back to Home</a></div>
    <h4 class="text-center mb-4 fw-bold">Sign In</h4>
    
    <div id="alertContainer"></div>

    <form id="loginForm" onsubmit="return false;">
      <div class="mb-3">
        <label class="form-label text-muted fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
          <input type="email" class="form-control border-start-0 bg-light" id="email" required placeholder="name@campusconnect.edu">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label text-muted fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" class="form-control border-start-0 bg-light" id="password" required placeholder="••••••••">
        </div>
      </div>
      <button type="button" id="loginBtn" class="btn btn-primary w-100 py-2 fw-bold mb-3">Login</button>
      
      <div class="text-center text-muted small">
        <p>Demo Admin: admin@campusconnect.edu / admin123</p>
        <p>Demo Student: student1@campusconnect.edu / student123</p>
      </div>
    </form>
  </div>

  <script>
    // Completely standalone, un-cacheable Vanilla JS logic
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('role') === 'admin') {
      document.getElementById('email').value = 'admin@campusconnect.edu';
      document.getElementById('password').value = 'admin123';
    }

    document.getElementById('loginBtn').addEventListener('click', async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if(!email || !password) return;

      document.getElementById('loader').style.display = 'flex';
      document.getElementById('alertContainer').innerHTML = '';
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (data.success && data.token) {
          localStorage.setItem('token', data.token);
          
          const meRes = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + data.token }
          });
          const meData = await meRes.json();
          
          localStorage.setItem('role', meData.data.role);
          localStorage.setItem('user', JSON.stringify(meData.data));
          
          if(meData.data.role === 'ADMIN') {
            window.location.href = 'admin/dashboard.html';
          } else if(meData.data.role === 'FACULTY') {
            window.location.href = 'faculty/dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        } else {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('alertContainer').innerHTML = `<div class="alert alert-danger">${data.message || 'Login failed'}</div>`;
        }
      } catch (err) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('alertContainer').innerHTML = `<div class="alert alert-danger">Network Error. Is the backend running?</div>`;
      }
    });
  </script>
</body>
</html>

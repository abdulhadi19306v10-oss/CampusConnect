<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-sm btn-outline-secondary me-3"><i class="fa-solid fa-house"></i> Home</a>
        <span class="me-3 fw-medium text-secondary user-name">Student</span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-2 d-none d-md-block sidebar px-0">
        <div class="nav flex-column">
          <a class="nav-link active" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
          <a class="nav-link" href="courses.html"><i class="fa-solid fa-book"></i> Courses</a>
          <a class="nav-link" href="timetable.html"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
          <a class="nav-link" href="bookings.html"><i class="fa-solid fa-building"></i> Facilities</a>
          <a class="nav-link" href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
          <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-md-10 dashboard-content bg-light">
        <h2 class="fw-bold mb-4">Welcome back, <span class="user-name text-primary">Student</span>!</h2>
        
        <div class="row g-4 mb-5">
          <div class="col-md-4">
            <div class="card stat-card p-4">
              <h6 class="text-muted text-uppercase fw-bold">My Courses</h6>
              <h2 class="display-5 fw-bold mb-0" id="courseCount">0</h2>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card stat-card warning p-4">
              <h6 class="text-muted text-uppercase fw-bold">Pending Bookings</h6>
              <h2 class="display-5 fw-bold mb-0" id="bookingCount">0</h2>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card stat-card danger p-4">
              <h6 class="text-muted text-uppercase fw-bold">Open Complaints</h6>
              <h2 class="display-5 fw-bold mb-0" id="complaintCount">0</h2>
            </div>
          </div>
        </div>

        <div class="row g-4">
          
          <div class="col-md-6">
            <div class="card h-100 border-0 shadow-sm">
              <div class="card-header bg-white pt-4 pb-0 border-bottom-0">
                <h5 class="fw-bold"><i class="fa-solid fa-clipboard-check text-info me-2"></i>My Attendance Record</h5>
              </div>
              <div class="card-body">
                <ul class="list-group list-group-flush" id="myAttendanceList">
                  <li class="list-group-item text-center text-muted">Loading attendance...</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="fw-bold"><i class="fa-solid fa-bullhorn text-primary me-2"></i>Recent Announcements</h5>
              </div>
              <div class="card-body" id="recentAnnouncements">
                <div class="text-center text-muted my-4">Loading...</div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="fw-bold"><i class="fa-solid fa-calendar-check text-success me-2"></i>Upcoming Bookings</h5>
              </div>
              <div class="card-body" id="upcomingBookings">
                <div class="text-center text-muted my-4">Loading...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    $(document).ready(function() {
      // Load Dashboard Stats
      API.getMyEnrollments().done(res => $('#courseCount').text(res.data.length));
      
      API.getMyBookings().done(res => {
        const pending = res.data.filter(b => b.status === 'PENDING').length;
        $('#bookingCount').text(pending);
        
        let html = '';
        const upcoming = res.data.filter(b => b.status === 'APPROVED').slice(0, 3);
        if(upcoming.length === 0) html = '<p class="text-muted">No upcoming bookings.</p>';
        upcoming.forEach(b => {
          html += `<div class="p-3 bg-light rounded mb-2 border">
            <strong>${b.facilityId.name}</strong><br>
            <small class="text-muted">${b.date} | ${b.startTime} - ${b.endTime}</small>
          </div>`;
        });
        $('#upcomingBookings').html(html);
      });

      
      API.getMyComplaints().done(res => {
        const open = res.data.filter(c => c.status === 'OPEN').length;
        $('#complaintCount').text(open);
      });
      
      // Fetch Attendance Stats Aggregated per Course
      $.ajax({
          url: '/api/attendance/my-attendance',
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
      }).done(res => {
          let html = '';
          if(res.data.length === 0) {
              html = '<li class="list-group-item text-muted text-center">No attendance records yet.</li>';
          } else {
              // Aggregate by course
              const courseStats = {};
              res.data.forEach(r => {
                  const cId = r.course._id;
                  if(!courseStats[cId]) {
                      courseStats[cId] = { title: r.course.title, code: r.course.courseCode, present: 0, absent: 0, late: 0, total: 0 };
                  }
                  courseStats[cId].total++;
                  if(r.status === 'Present') courseStats[cId].present++;
                  else if(r.status === 'Absent') courseStats[cId].absent++;
                  else if(r.status === 'Late') courseStats[cId].late++;
              });
              
              Object.values(courseStats).forEach(st => {
                  const effectivePresents = st.present + (st.late * 0.75);
                  const perc = st.total === 0 ? 0 : Math.round((effectivePresents / st.total) * 100);
                  const percColor = perc >= 75 ? 'success' : (perc >= 50 ? 'warning' : 'danger');
                  
                  html += `<li class="list-group-item">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong class="d-block text-primary">${st.code} - ${st.title}</strong>
                        <span class="fs-5 fw-bold text-${percColor}">${perc}%</span>
                    </div>
                    <div class="d-flex gap-2 small">
                        <span class="badge bg-success-subtle text-success border border-success-subtle">${st.present} Present</span>
                        <span class="badge bg-danger-subtle text-danger border border-danger-subtle">${st.absent} Absent</span>
                        <span class="badge bg-warning-subtle text-dark border border-warning-subtle">${st.late} Late</span>
                    </div>
                  </li>`;
              });
          }
          $('#myAttendanceList').html(html);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timetable - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-graduation-cap me-2"></i>CampusConnect</a>
      <div class="d-flex align-items-center">
        <a href="index.html" class="btn btn-sm btn-outline-secondary me-3"><i class="fa-solid fa-house"></i> Home</a>
        <span class="me-3 fw-medium text-secondary user-name">Student</span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 d-none d-md-block sidebar px-0">
        <div class="nav flex-column">
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
          <a class="nav-link" href="courses.html"><i class="fa-solid fa-book"></i> Courses</a>
          <a class="nav-link active" href="timetable.html"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
          <a class="nav-link" href="bookings.html"><i class="fa-solid fa-building"></i> Facilities</a>
          <a class="nav-link" href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
          <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        </div>
      </div>

      <div class="col-md-10 dashboard-content bg-light">
        <div class="card">
          <div class="card-header bg-white pt-4 pb-0 border-bottom-0">
            <h4 class="fw-bold">Class Timetable</h4>
          </div>
          <div class="card-body">
            
            <div class="mb-3 d-flex justify-content-end table-search-container">
              <div class="input-group" style="width: 250px;">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0 bg-light page-search" placeholder="Search...">
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-bordered text-center align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Time</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                    <th>Wednesday</th>
                    <th>Thursday</th>
                    <th>Friday</th>
                  </tr>
                </thead>
                <tbody id="timetableBody">
                  <!-- Generated by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    $(document).ready(function() {
      API.getTimetable().done(res => {
        // Simplified grid rendering
        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        const times = ['09:00 - 10:30', '11:00 - 12:30', '14:00 - 15:30', '16:00 - 17:30'];
        let html = '';
        
        times.forEach(timeLabel => {
          html += `<tr><td class="fw-bold bg-light">${timeLabel}</td>`;
          const tStart = timeLabel.split(' - ')[0];
          
          days.forEach(day => {
            const entry = res.data.find(t => t.day === day && t.startTime === tStart);
            if(entry) {
              html += `<td class="bg-primary bg-opacity-10">
                <strong>${entry.courseId?.courseCode || 'Course'}</strong><br>
                <small>${entry.room}</small><br>
                <small class="text-muted">${entry.instructor}</small>
              </td>`;
            } else {
              html += `<td></td>`;
            }
          });
          html += `</tr>`;
        });
        
        $('#timetableBody').html(html);
      });
    });
  </script>

  <script>
    $(document).ready(function() {
      // Global Table Live Search
      $('.page-search').on('keyup', function() {
        const value = $(this).val().toLowerCase();
        // find the closest table-responsive container which is a sibling of the search container
        $(this).closest('.table-search-container').next('.table-responsive').find('tbody tr').filter(function() {
          $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
      });
    });
  </script>
</body>
</html>
